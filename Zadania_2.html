<html>

<script type="text/javascript">

</script>
</head>
<body>

<div style="color:red;font-size:50px;">

</div>
	
<div style="font-size:20px;">

</div>

<div style="font-size:20px;">

document.write(""+zawod+"\n\n");
</script>
</div>


</body>
</html>
